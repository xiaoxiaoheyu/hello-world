<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指尖贪吃蛇</title><style>
:root{--ink:#101319;--lime:#d8ff3e;--cream:#f2f0e8;--red:#ff5b62}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font-family:Arial,"Microsoft YaHei",sans-serif}main{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 82% 20%,#d8ff3e12,transparent 27%),var(--ink)}header{height:72px;padding:0 5vw;border-bottom:1px solid #333841;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;display:flex;gap:12px;align-items:center}.dot{width:13px;height:13px;border-radius:50%;background:var(--lime);box-shadow:0 0 16px var(--lime)}.tag,.eyebrow{font:12px monospace;letter-spacing:.15em;color:var(--lime)}section{flex:1}.start{padding:9vh 8vw;position:relative;overflow:hidden}.start h1{font-size:clamp(54px,8vw,112px);line-height:.92;letter-spacing:-.06em;margin:25px 0}.start h1 span{color:var(--lime)}.start p{max-width:590px;color:#adb3ba;line-height:1.8;font-size:17px}.primary{border:0;background:var(--lime);color:var(--ink);font-weight:800;padding:17px 24px;margin-top:18px;box-shadow:6px 6px #717c31;cursor:pointer}.primary:hover{transform:translate(-2px,-2px)}.error{color:#ff9ba0;border:1px solid var(--red);padding:12px;margin-top:25px;max-width:620px}.steps{display:flex;gap:45px;margin-top:60px;color:#8d939b;font-size:13px}.steps b{color:var(--lime);margin-right:9px}.game{padding:20px 4vw;display:none;flex-direction:column;min-height:0}.bar{height:70px;display:flex;align-items:center;gap:30px}.score{font:42px monospace;color:var(--lime)}.state{margin-right:auto;font-size:12px;color:#8d939b}.state.on{color:var(--lime)}button.small{border:1px solid #454b54;background:transparent;color:#ddd;padding:9px 14px;cursor:pointer}.arena{position:relative;flex:1;min-height:520px;border:1px solid #3c424b;background:#151920}.arena>canvas{width:100%;height:100%;display:block}.camera{position:absolute;right:18px;top:18px;width:230px;aspect-ratio:4/3;border:2px solid #d8ff3e77;background:#090b0e}.camera video{display:none}.camera canvas{width:100%;height:100%}.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#101319dd;border:1px solid #404650;padding:9px 13px;color:#aeb3ba;font-size:12px}.over{display:none;place-items:center}.card{padding:60px 9vw;text-align:center;border:1px solid #414750;background:#151920}.card h2{font-size:55px;margin:10px}.card .final{font:100px monospace;color:var(--lime)}footer{padding:14px 4vw;color:#626871;font:10px monospace;text-align:right}@media(max-width:700px){.tag{display:none}.start{padding:8vh 6vw}.start h1{font-size:52px}.steps{flex-direction:column;gap:12px}.game{padding:10px}.camera{width:150px}.arena{min-height:540px}.hint{font-size:10px;white-space:nowrap}}
</style></head><body><main><header><div class="brand"><i class="dot"></i>指尖贪吃蛇</div><div class="tag">MEDIAPIPE 手势驱动</div></header>
<section class="start" id="start"><div class="eyebrow">NO KEYBOARD · JUST YOUR FINGER</div><h1>动动手指，<br><span>喂饱这条蛇。</span></h1><p>把食指举到摄像头前，蛇头会跟随你的指尖平滑移动。吃掉苹果得 1 分，别碰到地图边缘。</p><button class="primary" id="begin">开启摄像头并开始 ↗</button><div class="error" id="error" hidden></div><div class="steps"><span><b>01</b>允许摄像头</span><span><b>02</b>举起食指</span><span><b>03</b>追逐苹果</span></div></section>
<section class="game" id="game"><div class="bar"><div class="score" id="score">00</div><div class="state" id="state">请举起食指</div><button class="small" id="restart">重新开始</button><button class="small" id="exit">退出</button></div><div class="arena"><canvas id="gameCanvas"></canvas><div class="camera"><video id="video" playsinline muted></video><canvas id="preview" width="320" height="240"></canvas></div><div class="hint">食指移动到哪里，蛇头就会跟到哪里</div></div></section>
<section class="over" id="over"><div class="card"><div class="eyebrow">GAME OVER</div><h2>撞到边缘啦！</h2><div>本轮得分</div><div class="final" id="final">0</div><button class="primary" id="again">再来一局 ↗</button></div></section><footer>摄像头画面仅在本机处理</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script><script>
const $=id=>document.getElementById(id), start=$('start'),game=$('game'),over=$('over'),video=$('video'),preview=$('preview'),canvas=$('gameCanvas');let stream,hands,raf,target=null,points=[],apple,score=0,running=false,last=0;
function show(name){start.style.display=name==='start'?'block':'none';game.style.display=name==='game'?'flex':'none';over.style.display=name==='over'?'grid':'none'}
function stop(){running=false;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(hands){hands.close();hands=null}}
async function begin(){stop();$('error').hidden=true;try{if(!navigator.mediaDevices)throw Error('当前浏览器不支持摄像头，请使用最新版 Chrome 或 Edge。');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});show('game');score=0;$('score').textContent='00';video.srcObject=stream;await video.play();hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.55});hands.onResults(r=>{const tip=r.multiHandLandmarks&&r.multiHandLandmarks[0]&&r.multiHandLandmarks[0][8];$('state').textContent=tip?'已锁定指尖':'请举起食指';$('state').className='state'+(tip?' on':'');if(tip)target={x:1-tip.x,y:tip.y};const c=preview.getContext('2d');c.save();c.clearRect(0,0,320,240);c.translate(320,0);c.scale(-1,1);c.drawImage(video,0,0,320,240);c.restore();if(tip){c.strokeStyle='#d8ff3e';c.lineWidth=3;c.beginPath();c.arc((1-tip.x)*320,tip.y*240,11,0,7);c.stroke()}});running=true;detect();resetGame();raf=requestAnimationFrame(draw)}catch(e){stop();show('start');const box=$('error');box.hidden=false;box.textContent=e.name==='NotAllowedError'?'摄像头权限被拒绝，请在地址栏中允许后重试。':e.message}}
async function detect(){if(!running)return;if(video.readyState>=2)try{await hands.send({image:video})}catch(e){}requestAnimationFrame(detect)}
function resetGame(){points=[{x:.5,y:.58}];apple={x:.25,y:.4};target=null;last=performance.now();resize()}
function resize(){const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio}
function draw(now){if(!running)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,dt=Math.min((now-last)/1000,.04);last=now;let head=points[0];if(target){let dx=(target.x-head.x)*w,dy=(target.y-head.y)*h,d=Math.hypot(dx,dy);if(d>2){let s=Math.min(290*devicePixelRatio,d*3.5);head.x+=dx/d*s*dt/w;head.y+=dy/d*s*dt/h}}if(head.x<.015||head.x>.985||head.y<.025||head.y>.975){stop();$('final').textContent=score;show('over');return}if(Math.hypot((head.x-apple.x)*w,(head.y-apple.y)*h)<28*devicePixelRatio){score++;$('score').textContent=String(score).padStart(2,'0');points.push({...points.at(-1)});apple={x:.08+Math.random()*.84,y:.1+Math.random()*.8}}for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],dx=(a.x-b.x)*w,dy=(a.y-b.y)*h,d=Math.hypot(dx,dy),gap=17*devicePixelRatio;if(d>gap){b.x+=dx/d*(d-gap)/w;b.y+=dy/d*(d-gap)/h}}c.clearRect(0,0,w,h);c.fillStyle='#ff5b62';c.shadowColor='#ff5b62';c.shadowBlur=18;c.beginPath();c.arc(apple.x*w,apple.y*h,11*devicePixelRatio,0,7);c.fill();c.shadowBlur=0;[...points].reverse().forEach((p,r)=>{let i=points.length-1-r;c.fillStyle=i?'#aee72f':'#d8ff3e';c.beginPath();c.arc(p.x*w,p.y*h,(i?11:14)*devicePixelRatio,0,7);c.fill()});raf=requestAnimationFrame(draw)}
$('begin').onclick=begin;$('restart').onclick=begin;$('again').onclick=begin;$('exit').onclick=()=>{stop();show('start')};window.onresize=resize;
</script></body></html>
